name: Build and release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/*
      - mkosi.**
  workflow_dispatch:
  schedule:
    - cron: 5 10 * * *

jobs:
  build-release:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ matrix.target.distro }}-${{ matrix.target.release }}_${{ matrix.arch }}
    strategy:
      matrix:
        target:
          - distro: centos
            release: 10
          - distro: fedora
            release: 44
          - distro: fedora
            release: rawhide
          - distro: rhel-ubi
            release: 10
        arch: [x86-64, arm64]
        include:
          - arch: x86-64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Install mkosi
        uses: systemd/mkosi@f7401bdc8d23486bb346790dc92508381a062f3b

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: mkosi -d ${{ matrix.target.distro }} -r ${{ matrix.target.release }}

      - name: Delete symbolic links
        run: find mkosi.output -maxdepth 1 -type l -delete

      - name: Generate checksum file
        run: sha256sum * > SHA256SUMS
        working-directory: mkosi.output

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RELEASE_TAG }}
          path: mkosi.output/*
          retention-days: 2

      - name: Release image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete $RELEASE_TAG --cleanup-tag -y || true
          sleep 5
          gh release create $RELEASE_TAG mkosi.output/* \
            -pt "${{ matrix.target.distro }} ${{ matrix.target.release }} for ${{ matrix.arch }}"
